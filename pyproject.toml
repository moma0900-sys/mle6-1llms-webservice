[project]
name = "mle-llms-webservice"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "rumdl>=0.3.0",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
testpaths = ["llm_app/tests", "solution/tests"]

[tool.ruff]
target-version = "py313"

[tool.rumdl.MD033]
allowed-elements = ["details", "summary"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
